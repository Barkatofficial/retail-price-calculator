<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Retail Price Calculator</title>
<style>
  :root {
    --bg: #f3f6f5; --surface: #ffffff; --ink: #11201d; --muted: #5d6f6a;
    --brand: #0f766e; --brand-ink: #ffffff; --line: #dbe5e2; --accent: #fef3c7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--brand); color: var(--brand-ink); padding: 20px 16px 28px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { padding: 0 16px 32px; max-width: 560px; margin: -16px auto 0; }
  .panel { background: var(--surface); border-radius: 16px; padding: 16px;
           box-shadow: 0 2px 10px rgba(15,118,110,.08); border: 1px solid var(--line); }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  .input { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px;
           padding: 0 12px; background: #fff; }
  .input:focus-within { border-color: var(--brand); }
  .input span { color: var(--muted); font-weight: 600; margin-right: 6px; }
  input { width: 100%; border: 0; outline: 0; font-size: 18px; padding: 12px 0; background: transparent; color: var(--ink); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 12px; color: var(--muted); margin: -6px 0 14px; }
  button { width: 100%; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink);
           font-size: 17px; font-weight: 700; padding: 14px; cursor: pointer; }
  button:active { transform: scale(.98); }
  .error { color: #b91c1c; font-size: 13px; margin-top: 10px; min-height: 16px; }
  #results { display: none; margin-top: 20px; }
  .summary { background: var(--accent); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
  .summary strong { font-size: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .badge { display: inline-block; background: #ccfbf1; color: #115e59; font-weight: 700; font-size: 13px;
           border-radius: 999px; padding: 3px 10px; }
  .price { font-size: 24px; font-weight: 800; margin: 8px 0 2px; letter-spacing: -.3px; }
  .profit { font-size: 12px; color: var(--muted); }
  .profit b { color: var(--brand); }
  .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
<header>
  <h1>Retail Price Calculator</h1>
  <p>Enter the price you pay, pick your profit.</p>
</header>

<main>
  <section class="panel">
    <div class="field">
      <label for="actual">Actual price (retailer gives)</label>
      <div class="input"><span>₹</span><input id="actual" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="transport">Transport</label>
        <div class="input"><span>₹</span><input id="transport" type="number" inputmode="decimal" min="0" value="10"></div>
      </div>
      <div class="field">
        <label for="carry">Carry bag</label>
        <div class="input"><span>₹</span><input id="carry" type="number" inputmode="decimal" min="0" value="15"></div>
      </div>
    </div>
    <p class="hint">Default cost ₹25 (transport ₹10 + carry bag ₹15). You can change both.</p>

    <button id="go" type="button">Calculate</button>
    <div class="error" id="err"></div>
  </section>

  <section id="results">
    <div class="summary">
      Total cost: <strong id="cost"></strong><br>
      <span style="color:var(--muted)" id="breakdown"></span>
    </div>
    <div class="grid" id="grid"></div>
    <p class="note">Retail price = total cost + profit % on total cost</p>
  </section>
</main>

<script src="calc.js"></script>
<script>
  var fmt = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  function rupee(n) { return '₹' + fmt.format(Math.round(n * 100) / 100); }
  function el(id) { return document.getElementById(id); }

  function run() {
    var actual = el('actual').value;
    el('err').textContent = '';
    if (actual === '' || Number(actual) <= 0) {
      el('err').textContent = 'Please enter the actual price.';
      el('results').style.display = 'none';
      return;
    }
    var t = el('transport').value === '' ? 0 : el('transport').value;
    var c = el('carry').value === '' ? 0 : el('carry').value;
    var r = calculate(actual, t, c);

    el('cost').textContent = rupee(r.cost);
    el('breakdown').textContent = rupee(Number(actual)) + ' + transport ' + rupee(Number(t)) + ' + bag ' + rupee(Number(c));

    el('grid').innerHTML = r.rows.map(function (row) {
      return '<div class="card"><span class="badge">' + row.percent + '% profit</span>' +
             '<div class="price">' + rupee(row.retail) + '</div>' +
             '<div class="profit">You earn <b>' + rupee(row.profit) + '</b></div></div>';
    }).join('');

    el('results').style.display = 'block';
    el('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  el('go').addEventListener('click', run);
  ['actual', 'transport', 'carry'].forEach(function (id) {
    el(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
  });
</script>
</body>
</html>
